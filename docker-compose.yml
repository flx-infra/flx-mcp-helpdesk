# ---------------------------------------------------------------------------
# flx-mcp-helpdesk: acceso compartido de los agentes de Flexxus al Helpdesk (servidor MCP)
#
# Codigo e imagen: bitbucket.org/flexxus_id/flx-mcp-helpdesk
# Este repo es solo el stack: lo que Portainer despliega.
#
# Sin estado. Sin puerto publicado ni token: lo usan los stacks conectados a la red
# "flx-agentes" (el Asistente y, mas adelante, el Cotizador) con
# http://flx-mcp-helpdesk_mcp:8101/mcp.
#
# Variables del stack: SERVICE_NAME, NODE, LOKI_URL y los secretos HELPDESK_EMAIL y
# HELPDESK_PASSWORD (usuario del Helpdesk con rol agente; las respuestas y notas que
# publiquen las webs figuran a nombre de ese usuario).
# ---------------------------------------------------------------------------
version: '3.6'

services:
  mcp:
    image: fabreguesm/flx-mcp-helpdesk:0.1.0
    hostname: flx-mcp-helpdesk
    networks:
      - agentes
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - HELPDESK_EMAIL=${HELPDESK_EMAIL}
      - HELPDESK_PASSWORD=${HELPDESK_PASSWORD}
    deploy:
      placement:
        constraints: ["${NODE}"]
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

networks:
  agentes:
    external: true
    name: flx-agentes
